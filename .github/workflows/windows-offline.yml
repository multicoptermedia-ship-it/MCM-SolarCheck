name: windows-offline-validation
on:
  push:
    branches:
      - main
      - feature/offline-human-report-approval
      - feature/offline-project-rgb-preview-gui
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-native:
    # Windows Server 2022 runner validates real Win32 APIs, NOT Windows 10 certification.
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify actual MSVC and Windows SDK with disposable compiler files
        shell: pwsh
        run: |
          python -m pip install pytest
          python -m pytest -q tests/test_buildtools_probe.py
      - name: Install runtime and test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Test external RGB and thermal GeoTIFF intake and PV mapping
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
          OPENBLAS_NUM_THREADS: '2'
          OMP_NUM_THREADS: '2'
        run: |
          python -m pytest -q tests/test_project_orthophoto_pair_registration.py tests/test_orthomosaic_geotiff_contract.py tests/test_orthophoto_layer_alignment.py tests/test_gui_geotiff_inspection.py tests/test_gui_orthophoto_comparison.py tests/test_gui_external_orthophoto_pair.py tests/test_import_page_native_orthophoto_action.py tests/test_gui_plant_orthophotos.py tests/test_micmac_orthophotos.py tests/test_colmap_openmvs_pilot.py tests/test_openmvs_orthomap.py tests/test_micmac_rgb_results_summary.py tests/test_gui_micmac_orthophotos.py tests/test_gui_plant_overview_vertical.py tests/test_orthophoto_pv_modules.py tests/test_gui_orthophoto_pv_review.py tests/test_schema_migration_v11.py tests/test_schema_migration_v12.py tests/test_report_release_decision.py tests/test_current_development_handoff.py
      # The Tk pilot is a separate process from the Qt main application in use.
      # Keep native interpreter/GC lifetimes separate here as well.
      - name: Test standalone Tk RGB pilot in its own process
        shell: pwsh
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_rgb_pilot_launcher.py
      - name: Test standalone read-only Windows setup probes
        shell: pwsh
        run: python -m pytest -q tests/test_opencl_probe.py tests/test_buildtools_logcheck.py tests/test_buildtools_interactive_command.py
      - name: Test real Windows DPAPI and local desktop/admin boundaries
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pytest -q tests/test_windows_admin_native.py tests/test_windows_admin_dpapi_boundary.py tests/test_windows_admin_credential_migration_lock.py tests/test_offline_admin_password_rotation_gui.py tests/test_windows_offline_startup.py tests/test_windows10_offline_vertical.py tests/test_offline_module_launcher.py tests/test_offline_existing_database_launcher.py tests/test_download_folder_starter.py tests/test_offline_wheelhouse.py tests/test_windows_wheelhouse_package.py tests/test_offline_training_jobs.py tests/test_offline_report_training_optin.py tests/test_offline_ai_open_source.py tests/test_public_infrared_import.py tests/test_public_infrared_baseline.py tests/test_m3t_original_zip_archive.py tests/test_m3t_original_zip_cli.py tests/test_original_zip_project_bridge.py tests/test_windows10_original_zip_acceptance.py tests/test_original_files_project_bridge.py tests/test_plant_identity_readiness_vertical.py tests/test_original_files_acceptance.py tests/test_gui_project_rgb_preview.py
      - name: Start disposable offline desktop without Python network access
        shell: pwsh
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m mcm_solarcheck.offline.windows_smoke --headless
